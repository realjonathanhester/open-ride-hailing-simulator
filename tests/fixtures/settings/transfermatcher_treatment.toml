[simulation]
pooling_enabled = true
reassignment_enabled = true
batch_matching_interval_seconds = 60
handoffs_enabled = true
max_handoff_wait_seconds = 300
max_request_to_assignment_seconds = 300
max_request_to_pickup_seconds = 1200
pickup_dwell_seconds = 0
dropoff_dwell_seconds = 0
default_num_requested_seats = 1
default_num_available_seats = 4
average_speed_meters_per_second = 10.0

[hooks]
matching = "transfermatcher"
routing = "straight_line"

[matching]
transfers_enabled = true
max_rider_path_ratio = 1.25
max_insertion_evaluations = 5000
