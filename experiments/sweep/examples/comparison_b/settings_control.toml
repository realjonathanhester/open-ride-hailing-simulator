# Comparison B control: Austin weekday 10k straight-line, pooling on,
# built-in greedy_nearest_eta (unlimited pooling detours). Same as Comparison A
# pooling-on arm. Pair with settings_treatment.toml.
# Fleet fractions, reassignment and max_candidate_cars are set on the rhs-sweep
# command line (see README.md).
# DO NOT RUN until Technical Program Manager review.
[simulation]
pooling_enabled = true
reassignment_enabled = true
max_request_to_assignment_seconds = 300
max_request_to_pickup_seconds = 1200
pickup_dwell_seconds = 30
dropoff_dwell_seconds = 15
default_num_requested_seats = 1
default_num_available_seats = 4
average_speed_meters_per_second = 8.0
timezone = "America/Chicago"

[hooks]
matching = "greedy_nearest_eta"
routing = "straight_line"
